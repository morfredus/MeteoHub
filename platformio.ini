; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples

[platformio]
default_envs = esp32-s3-oled

; Reglages communs au FIRMWARE (materiel). Sortis d'un [env] global pour que
; l'environnement de tests hote (native) n'herite d'aucun reglage de board :
; sinon board_build.* reclame un board que la plateforme native ne connait pas.
[firmware]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
board_build.filesystem = littlefs
; Table de partitions EPINGLEE (voir partitions.csv) : garantit deux slots d'app
; ota_0/ota_1, sans quoi l'OTA (Update.begin) peut echouer si un defaut de board
; change le schema. Reproduit l'existant en flash, donc sans effet de bord.
board_build.partitions = partitions.csv
board_build.usb_mode = "cdc"
board_build.usb_on_boot = 1
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-D CORE_DEBUG_LEVEL=3
	-D PROJECT_NAME='"MeteoHub S3"'
; PROJECT_VERSION n'est PAS ecrit ici : il est injecte par scripts/version.py
; depuis le fichier VERSION a la racine, qui fait autorite comme dans les autres
; projets de l'ecosysteme. Deux endroits pour une meme valeur finissent toujours
; par diverger.
extra_scripts =
	pre:scripts/version.py
	pre:scripts/embed_web_files.py

lib_deps =
	adafruit/Adafruit NeoPixel@^1.12.0
	madhephaestus/ESP32Encoder@^0.11.8
	adafruit/Adafruit AHTX0@^2.0.5
	adafruit/Adafruit BMP280 Library@^2.6.8
	bblanchon/ArduinoJson@^6.21.4
	mathieucarbou/ESPAsyncWebServer@^3.1.1

[env:esp32-s3-oled]
extends = firmware
build_flags =
	${firmware.build_flags}
	-D ESP32_S3_OLED
lib_deps =
	${firmware.lib_deps}
	olikraus/U8g2@^2.36.14

; --- Tests unitaires hote (logique de synchronisation cote hub) -----------
; env NATIF : SyncTracker (accuse cumulatif, trous, dedup, anti-blocage) et
; TimeAnchor (reconstruction heure de mesure). Logique pure, sans materiel.
; N'etend PAS [firmware] : aucun reglage de board.
;   pio test -e native
[env:native]
platform = native
build_flags =
	-std=gnu++17
	-I include
test_framework = unity
test_filter = test_native_*
