; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples

[platformio]
default_envs = esp32-s3-oled

; Reglages communs au FIRMWARE (materiel). Sortis d'un [env] global pour que
; l'environnement de tests hote (native) n'herite d'aucun reglage de board :
; sinon board_build.* reclame un board que la plateforme native ne connait pas.
; Les reglages PROPRES A UNE CARTE (board, flash, partitions, USB, peripheriques
; d'entree) vivent dans chaque env ci-dessous ; le brochage, lui, est choisi
; dans include/board_config.h selon le define de carte.
[firmware]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-D CORE_DEBUG_LEVEL=3
	-D PROJECT_NAME='"MeteoHub S3"'
; PROJECT_VERSION n'est PAS ecrit ici : il est injecte par scripts/version.py
; depuis le fichier VERSION a la racine, qui fait autorite comme dans les autres
; projets de l'ecosysteme. Deux endroits pour une meme valeur finissent toujours
; par diverger.
extra_scripts =
	pre:scripts/version.py
	pre:scripts/embed_web_files.py

lib_deps =
	adafruit/Adafruit NeoPixel@^1.12.0
	adafruit/Adafruit AHTX0@^2.0.5
	adafruit/Adafruit BMP280 Library@^2.6.8
	bblanchon/ArduinoJson@^6.21.4
	mathieucarbou/ESPAsyncWebServer@^3.1.1
	olikraus/U8g2@^2.36.14

; --- ESP32-S3 DevKitC-1 N16R8 (montage historique) -------------------------
; 16 Mo flash / 8 Mo PSRAM octale. OLED SH1106 1,3", encodeur EC11 + boutons
; Back / Confirm, SD avec detection de carte.
[env:esp32-s3-oled]
extends = firmware
board = esp32-s3-devkitc-1-n16r8v
; Table de partitions EPINGLEE (voir partitions.csv) : garantit deux slots d'app
; ota_0/ota_1, sans quoi l'OTA (Update.begin) peut echouer si un defaut de board
; change le schema. Reproduit l'existant en flash, donc sans effet de bord.
board_build.partitions = partitions.csv
board_build.usb_mode = "cdc"
board_build.usb_on_boot = 1
build_flags =
	${firmware.build_flags}
	-D ESP32_S3_OLED
lib_deps =
	${firmware.lib_deps}
	madhephaestus/ESP32Encoder@^0.11.8

; --- ESP32-S3 Super Mini (montage simplifie) ------------------------------
; Meme carte que la sonde MeteoHubSensor. Super Mini v0.2 : 4 Mo de flash +
; 2 Mo de PSRAM QUAD. OLED 0,96" SSD1306 (JMD0.96D-1), un seul bouton, SD sans
; detection de carte.
; - Profil generique esp32-s3-devkitc-1 bride a 4 Mo. Ne PAS passer a
;   lolin_s3_mini : ce profil suppose une PSRAM OCTALE et fait boucler le boot
;   sur cette carte a PSRAM quad (constate sur la sonde).
; - PSRAM ACTIVEE (BOARD_HAS_PSRAM + qio_qspi), contrairement a la sonde : les
;   tampons d'historique (malloc > 4 Ko) y partent automatiquement et laissent
;   la SRAM interne a AsyncTCP / WiFi. 2 Mo suffisent : tous les tampons RAM
;   sont bornes (pire cas < 300 Ko).
; - Table 4 Mo (partitions_4mb.csv) : premier flash en USB obligatoire, une
;   table de partitions ne s'applique pas par OTA.
[env:esp32-s3-supermini]
extends = firmware
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions_4mb.csv
upload_speed = 921600
build_flags =
	${firmware.build_flags}
	-D ESP32_S3_OLED
	-D BOARD_S3_SUPERMINI
	-D BOARD_HAS_PSRAM
	; USB CDC natif du S3 Super Mini (GPIO 19/20) pour la console Serial.
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

; --- Tests unitaires hote (logique de synchronisation cote hub) -----------
; env NATIF : SyncTracker (accuse cumulatif, trous, dedup, anti-blocage) et
; TimeAnchor (reconstruction heure de mesure). Logique pure, sans materiel.
; N'etend PAS [firmware] : aucun reglage de board.
;   pio test -e native
[env:native]
platform = native
build_flags =
	-std=gnu++17
	-I include
test_framework = unity
test_filter = test_native_*
