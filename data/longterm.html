<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique - MeteoHub S3</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body data-page="longterm">
    <div class="container">
        <header>
            <h1>Historique</h1>
            <div id="status">Connexion...</div>
        </header>

        <nav data-shared-menu="true" data-active="/longterm.html"></nav>

        <!-- Filtres identiques à morfAnalytics (Météo > Graphiques). Les listes de
             grandeurs, de sources et de périodes sont injectées par app.js. -->
        <div class="period-bar hist-controls">
            <span class="metricsel"><span class="mslabel">Afficher</span><span id="metricsel"></span></span>
            <div class="field">
                <label for="sourceCtx">Source</label>
                <select id="sourceCtx"></select>
            </div>
            <label class="mk" title="Points écartés des courbes (pic isolé)"><input type="checkbox" id="showsusp"> Points écartés</label>
            <div class="periods" id="periods"></div>
            <div class="custom" id="custom" hidden>
                <label>Du <input type="datetime-local" id="cfrom" step="300"></label>
                <label>au <input type="datetime-local" id="cto" step="300"></label>
                <button type="button" class="pbtn" id="capply">Afficher</button>
                <button type="button" class="pbtn" id="cnow" title="Termine la période à l'instant présent">Jusqu'à maintenant</button>
                <span class="err" id="cerr"></span>
            </div>
            <span class="rangelbl" id="rangelbl"></span>
            <div class="field">
                <label for="synthToggle"><input type="checkbox" id="synthToggle"> Synthèse</label>
                <label for="autoRefreshToggle"><input type="checkbox" id="autoRefreshToggle" checked> Temps réel</label>
            </div>
        </div>

        <div id="synthPanel" class="synth-panel" hidden></div>

        <div class="hist-wrap">
            <div id="charts"><p class="muted">Chargement&hellip;</p></div>
            <div id="chartLoading" class="chart-loading" hidden>Chargement en cours…</div>
        </div>

        <footer>
        </footer>
    </div>

    <script src="app.js"></script>
    <script src="menu.js"></script>
    <script src="footer.js"></script>
</body>
</html>
