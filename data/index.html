<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeteoHub</title>
    <link rel="stylesheet" href="style.css">
    <!-- L'accueil n'a plus de graphe : Chart.js n'est chargé que sur la page
         Historique. Injection des min/max conservée (utilisée ailleurs). -->
    <script src="graph_config.js"></script>
</head>
<body data-page="dashboard">
    <div class="container">
        <header>
            <h1>MeteoHub</h1>
            <div class="header-right">
                <span id="sensorInvalidBadge" class="sensor-badge" hidden>Capteur invalide</span>
                <div id="status">Connexion...</div>
            </div>
        </header>

        <nav data-shared-menu="true" data-active="/"></nav>

        <!-- Station météo : la valeur extérieure "utile" (OUT si disponible, sinon
             secours intérieur clairement signalé). C'est la réponse à "quel temps
             fait-il dehors ?". -->
        <section class="hero" id="hero">
            <div class="hero-head">
                <span class="hero-title">Extérieur</span>
                <span id="heroBadge" class="hero-badge" hidden></span>
            </div>
            <div class="hero-values">
                <div class="hero-temp"><span id="heroTemp">--</span><span class="unit">°C</span></div>
                <div class="hero-hum"><span id="heroHum">--</span><span class="unit">%</span></div>
            </div>
            <div id="heroState" class="hero-state"></div>
        </section>

        <!-- Détail OUT (météo extérieure) et IN (confort intérieur). -->
        <div class="grid station-grid">
            <div class="card station out">
                <h2>Extérieur (OUT)</h2>
                <div class="metric"><span>Température</span><b><span id="outTemp">--</span> °C</b></div>
                <div class="metric"><span>Humidité</span><b><span id="outHum">--</span> %</b></div>
                <div class="metric"><span>Pression</span><b><span id="outPres">--</span> hPa</b></div>
                <div class="metric" id="outBatteryRow" hidden><span>Batterie sonde</span><b><span id="outBattery">--</span> %</b></div>
                <div id="outBatteryAlert" class="freshness warn" hidden></div>
                <div id="outFreshness" class="freshness"></div>
            </div>
            <div class="card station in">
                <h2>Intérieur (confort)</h2>
                <div class="metric"><span>Température</span><b><span id="inTemp">--</span> °C</b></div>
                <div class="metric"><span>Humidité</span><b><span id="inHum">--</span> %</b></div>
            </div>
        </div>

        <div class="card" id="alertCard" style="margin-bottom: 20px;">
            <h2>Alerte météo</h2>
            <div id="alertText">Aucune alerte</div>
            <div id="alertValidity" class="alert-validity">Validité : --</div>
            <button id="alertDetailsBtn" class="alert-details-icon" type="button" disabled aria-label="Voir détails complets" title="Voir détails complets">📜</button>
        </div>

        <div id="alertModal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="alertModalTitle">
            <div class="modal-content">
                <button id="alertModalClose" class="modal-close" type="button" aria-label="Fermer">×</button>
                <h3 id="alertModalTitle">Détails de l'alerte</h3>
                <div id="alertModalBody">Aucune alerte active.</div>
            </div>
        </div>

        <!-- L'accueil ne porte plus de graphe d'historique : il montrait l'intérieur
             (peu pertinent en page d'accueil météo). L'historique, avec sélection de
             période et échelle de temps adaptée, vit sur la page Historique. -->

        <footer>
        </footer>
    </div>

    <script src="app.js"></script>
    <script src="menu.js"></script>
    <script src="footer.js"></script>
</body>
</html>
